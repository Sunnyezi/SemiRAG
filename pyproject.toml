[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semirag"
version = "0.1.0"
description = "Agentic RAG workflows for semiconductor knowledge."
readme = "README.md"
requires-python = ">=3.11,<3.12"

[project.scripts]
semirag = "semirag.main:main"
semirag-agentic = "semirag.workflows.agentic.graph1:main"
semirag-adaptive = "semirag.workflows.adaptive.graph_2:main"
semirag-ingest = "semirag.ingestion.write_milvus:main"

[tool.setuptools.packages.find]
where = ["src"]
